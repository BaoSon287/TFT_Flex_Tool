<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT Flex Solver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2845 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
        }

        h1 {
            font-size: 2.5em;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 0.95em;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(20, 40, 80, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel-title {
            font-size: 1.2em;
            color: #00d4ff;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            padding-bottom: 10px;
        }

        /* ===== CHAMPION LISTS ===== */
        .champion-input {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        input[type="text"]::placeholder {
            color: #808080;
        }

        button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .champion-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .champion-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #1a4d6d 0%, #0d2a3d 100%);
            border: 1px solid #00d4ff;
            border-radius: 20px;
            color: #00d4ff;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .champion-tag:hover {
            background: linear-gradient(135deg, #0d2a3d 0%, #1a4d6d 100%);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .champion-tag img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .champion-tag .remove {
            cursor: pointer;
            font-weight: bold;
            margin-left: 4px;
        }

        /* ===== SETTINGS ===== */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .setting-row label {
            font-weight: 500;
            color: #b0b0b0;
            flex: 1;
        }

        .setting-row input[type="number"],
        .setting-row select {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #e0e0e0;
            width: 100px;
            cursor: pointer;
        }

        .setting-row select {
            width: 120px;
        }

        select option {
            background: #1a2845;
            color: #e0e0e0;
        }

        /* ===== EMBLEMS ===== */
        .emblem-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }

        .emblem-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .emblem-item img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .emblem-item label {
            flex: 1;
            font-size: 0.9em;
            color: #b0b0b0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .emblem-item input[type="number"] {
            width: 60px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 4px;
            color: #00d4ff;
            text-align: center;
            font-weight: 600;
        }

        /* ===== RESULTS ===== */
        .results-section {
            grid-column: 1 / -1;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .results-table thead {
            background: rgba(0, 212, 255, 0.1);
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .results-table th,
        .results-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .results-table th {
            color: #00d4ff;
            font-weight: 600;
        }

        .results-table tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .team-champions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .champ-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            border-radius: 4px;
            font-size: 0.85em;
            color: #00d4ff;
        }

        .champ-badge img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 🔥 FORCED CHAMPION */
        .champ-badge.forced {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border-color: #ff9800;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.7);
        }

        .score-badge {
            padding: 4px 10px;
            background: linear-gradient(135deg, #ff6b00, #ff9500);
            border-radius: 4px;
            color: white;
            font-weight: 600;
            min-width: 60px;
            text-align: center;
        }

        /* ===== LOADING ===== */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #00d4ff;
        }

        .spinner {
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== RUN BUTTON ===== */
        .run-button {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: 600;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #000;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .run-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .run-button:hover:not(:disabled) {
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr 1fr;
            }
            
            .results-section {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .emblem-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.5);
        }

        .error {
            padding: 15px;
            background: rgba(255, 67, 54, 0.2);
            border: 1px solid #ff4336;
            border-radius: 6px;
            color: #ff9999;
            margin-bottom: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #808080;
        }

        /* ===== AUTOCOMPLETE DROPDOWN ===== */
        .autocomplete-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 70px;
            background: #0d2a3d;
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 6px;
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 999;
            display: none;
        }

        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .autocomplete-item img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .autocomplete-item:hover {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }

        /* ===== TRAIT DISPLAY ===== */
        .trait-toggle {
            margin-left: 10px;
            cursor: pointer;
            color: #00d4ff;
            font-weight: bold;
            font-size: 26px;        
            user-select: none;
            display: inline-block;
            width: 26px;
            text-align: center;
        }


        .trait-panel {
            margin-top: 6px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.35);
            border-left: 3px solid #00d4ff;
            border-radius: 4px;
            font-size: 0.85em;
            display: none;
        }

        .trait-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 2px 6px 2px 0;
            padding: 3px 8px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 12px;
            color: #00d4ff;
        }

        .trait-badge img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        /* Image fallback placeholder */
        .img-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 50%;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ TFT Flex Solver</h1>
            <p class="subtitle">Tìm team comp tối ưu cho set TFT hiện tại</p>
        </header>

        <div class="error" id="errorMsg"></div>

        <div class="main-layout">
            <!-- LEFT: Forced Champions -->
            <div class="panel">
                <div class="panel-title">👥 Buộc Champion</div>
                <div class="champion-input" style="position: relative;">
                    <input 
                        type="text" 
                        id="forcedInput" 
                        placeholder="Tìm champion..."
                        autocomplete="off"
                    >
                    <button onclick="addForcedChampion()">Thêm</button>
                    <div class="autocomplete-box" id="forcedSuggest"></div>
                </div>

                <div class="champion-list" id="forcedList"></div>
            </div>

            <!-- MIDDLE: Banned Champions -->
            <div class="panel">
                <div class="panel-title">🚫 Cấm Champion</div>
                <div class="champion-input" style="position: relative;">
                    <input 
                        type="text" 
                        id="bannedInput" 
                        placeholder="Tìm champion..."
                        autocomplete="off"
                    >
                    <button onclick="addBannedChampion()">Thêm</button>
                    <div class="autocomplete-box" id="bannedSuggest"></div>
                </div>
                <div class="champion-list" id="bannedList"></div>
            </div>

            <!-- TOP RIGHT: Settings -->
            <div class="panel">
                <div class="panel-title">⚙️ Cài Đặt</div>
                
                <div class="setting-row">
                    <label>Giải Pháp:</label>
                    <select id="solverSelect">
                        <option value="ryze">Ryze</option>
                        <option value="bronze">Bronze</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label>Kích Thước Đội Hình:</label>
                    <input type="number" id="maxTeam" value="8" min="1" max="12">
                </div>

                <div class="setting-row">
                    <label>Thời Gian (giây):</label>
                    <input type="number" id="timeLimit" value="20" min="1" max="60">
                </div>

                <button class="run-button" onclick="runSolver()" id="runBtn">
                    🚀 Chạy Solver
                </button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Đang tìm team comp tối ưu...</p>
                </div>
            </div>

            <!-- BOTTOM: Emblems -->
            <div class="panel" style="grid-column: 1 / -1;">
                <div class="panel-title">✨ Emblem Editor</div>
                <div class="emblem-grid" id="emblemGrid"></div>
            </div>

            <!-- BOTTOM: Results -->
            <div class="panel results-section">
                <div class="panel-title">📊 Kết Quả</div>
                <div id="resultsContainer">
                    <div class="no-results">Chạy solver để xem kết quả</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allChampions = [];
        let championSearchSource = [];
        let allTraits = {};
        let forcedChampions = [];
        let bannedChampions = [];

        // ===== INITIALIZATION =====
        async function init() {
            try {
                const [champRes, traitRes, defaultRes] = await Promise.all([
                    fetch("/api/champions"),
                    fetch("/api/traits"),
                    fetch("/api/defaults")
                ]);

                const champData = await champRes.json();
                const traitData = await traitRes.json();
                const defaultData = await defaultRes.json();

                if (champData.success) {
                    allChampions = champData.data;
                    championSearchSource = [...allChampions];
                    if (champData.default_banned) {
                        bannedChampions = [...champData.default_banned];
                        renderChampionList("bannedList", bannedChampions);
                    }
                    setupAutocomplete();
                }

                if (traitData.success) {
                    allTraits = traitData.data;
                    buildEmblemGrid();
                }

                if (defaultData.banned) {
                    bannedChampions = [...defaultData.banned];
                    renderChampionList("bannedList", bannedChampions);
                }
            } catch (error) {
                showError("Không thể tải dữ liệu: " + error.message);
            }
        }

        // ===== HELPER: Get Champion Image =====
        function getChampionImage(name) {
            const champ = allChampions.find(c => c.name === name);
            return champ && champ.image ? champ.image : null;
        }

        // ===== HELPER: Get Trait Image =====
        function getTraitImage(traitName) {
            const trait = allTraits[traitName];
            return trait && trait.image ? trait.image : null;
        }

        // ===== AUTOCOMPLETE =====
        function setupAutocomplete() {
            bindAutocomplete(
                "forcedInput",
                "forcedSuggest",
                forcedChampions,
                addForcedChampion
            );
            bindAutocomplete(
                "bannedInput",
                "bannedSuggest",
                bannedChampions,
                addBannedChampion
            );
        }

        function bindAutocomplete(inputId, boxId, list, addFn) {
            const input = document.getElementById(inputId);
            const box = document.getElementById(boxId);

            input.addEventListener("input", () => {
                const value = input.value.toLowerCase();
                box.innerHTML = "";

                if (!value) {
                    box.style.display = "none";
                    return;
                }

                const matches = championSearchSource
                    .filter(champ =>
                        champ.name.toLowerCase().startsWith(value.toLowerCase())
                    )
                    .slice(0, 8);



                if (!matches.length) {
                    box.style.display = "none";
                    return;
                }

                matches.forEach(champ => {
                    const isBanned = bannedChampions.includes(champ.name);

                const div = document.createElement("div");
                div.className = "autocomplete-item";
                if (isBanned) div.style.opacity = "0.5";

                const imgSrc = champ.image;
                const imgHtml = imgSrc 
                    ? `<img src="${imgSrc}" onerror="this.style.display='none'" alt="${champ.name}">`
                    : `<span class="img-placeholder">👤</span>`;

                div.innerHTML = `
                    ${imgHtml}
                    <span>
                        ${champ.name}
                        ${isBanned ? '<em style="color:#ff6666; margin-left:6px">(đã bị ban)</em>' : ''}
                    </span>
                `;

                    
                    div.onclick = () => {
                        if (isBanned) {
                            showError("⚠️ Tướng này đã được ban, hãy gỡ khỏi Ban trước");
                            return;
                        }
                        input.value = champ.name;
                        addFn();
                        box.style.display = "none";
                    };
                    box.appendChild(div);
                });

                box.style.display = "block";
            });

            input.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    addFn();
                    box.style.display = "none";
                }
            });

            document.addEventListener("click", e => {
                if (!input.contains(e.target) && !box.contains(e.target)) {
                    box.style.display = "none";
                }
            });
        }

        // ===== ADD CHAMPIONS =====
        function addForcedChampion() {
            addChampion("forcedInput", "forcedList", forcedChampions);
        }

        function addBannedChampion() {
            addChampion("bannedInput", "bannedList", bannedChampions);
        }

        function addChampion(inputId, listId, list) {
            const input = document.getElementById(inputId);
            const rawName = input.value.trim();
            if (!rawName) return;

            // 🔑 tìm champion chuẩn theo tên (case-insensitive)
            const champ = allChampions.find(
                c => c.name.toLowerCase() === rawName.toLowerCase()
            );

            if (!champ) {
                showError("Champion không tồn tại!");
                return;
            }

            const canonicalName = champ.name; // VD: "Aatrox"

            if (list.includes(canonicalName)) {
                showError("Champion đã được thêm!");
                return;
            }

            // ✅ luôn push tên chuẩn
            list.push(canonicalName);
            input.value = "";
            renderChampionList(listId, list);
        }


        function removeChampion(list, name) {
            const idx = list.indexOf(name);
            if (idx > -1) list.splice(idx, 1);
            const listId = list === forcedChampions ? "forcedList" : "bannedList";
            renderChampionList(listId, list);
        }

        function renderChampionList(listId, list) {
            const container = document.getElementById(listId);
            container.innerHTML = list.map(name => {
                const imgSrc = getChampionImage(name);
                const imgHtml = imgSrc 
                    ? `<img src="${imgSrc}" onerror="this.style.display='none'" alt="${name}">`
                    : `<span class="img-placeholder">👤</span>`;
                
                return `
                    <div class="champion-tag">
                        ${imgHtml}
                        ${name}
                        <span class="remove" onclick="removeChampion(${list === forcedChampions ? 'forcedChampions' : 'bannedChampions'}, '${name}')">×</span>
                    </div>
                `;
            }).join("");
        }

        // ===== EMBLEMS =====
        function buildEmblemGrid() {
            const grid = document.getElementById("emblemGrid");
            grid.innerHTML = Object.entries(allTraits).map(([trait, data]) => {
                const imgSrc = data.image;
                const imgHtml = imgSrc 
                    ? `<img src="${imgSrc}" onerror="this.style.display='none'" alt="${trait}">`
                    : `<span>⚡</span>`;
                
                return `
                    <div class="emblem-item">
                        <label>
                            ${imgHtml}
                            ${trait}
                        </label>
                        <input type="number" class="emblem-input" data-trait="${trait}" value="0" min="0" max="5">
                    </div>
                `;
            }).join("");
        }

        // ===== RUN SOLVER =====
        async function runSolver() {
            const runBtn = document.getElementById("runBtn");
            runBtn.disabled = true;
            document.getElementById("loading").style.display = "block";

            try {
                const emblems = {};
                document.querySelectorAll(".emblem-input").forEach(input => {
                    emblems[input.dataset.trait] = parseInt(input.value) || 0;
                });

                const response = await fetch("/api/solve", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        solver: document.getElementById("solverSelect").value,
                        max_team: parseInt(document.getElementById("maxTeam").value),
                        time_limit: parseInt(document.getElementById("timeLimit").value),
                        forced: forcedChampions,
                        banned: bannedChampions,
                        emblems: emblems
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.data);
                } else {
                    showError(data.error || "Lỗi khi chạy solver");
                }
            } catch (error) {
                showError("Lỗi: " + error.message);
            } finally {
                runBtn.disabled = false;
                document.getElementById("loading").style.display = "none";
            }
        }

        function calculateTraits(team) {
            const counts = {};
            const SPECIAL_TRAITS = ["Darkin", "Targon"];

            // 1️⃣ Đếm trait từ champion
            team.forEach(name => {
                const champ = allChampions.find(c => c.name === name);
                if (!champ || !Array.isArray(champ.traits)) return;

                champ.traits.forEach(trait => {
                    counts[trait] = (counts[trait] || 0) + 1;
                });
            });

            // 2️⃣ Cộng từ emblem
            document.querySelectorAll(".emblem-input").forEach(input => {
                const value = parseInt(input.value) || 0;
                if (value > 0) {
                    counts[input.dataset.trait] =
                        (counts[input.dataset.trait] || 0) + value;
                }
            });

            // 3️⃣ Xác định hệ hiển thị
            const active = [];

            for (const trait in counts) {
                const count = counts[trait];
                const traitObj = allTraits[trait];

                // 🔥 Darkin / Targon → có là hiện
                if (SPECIAL_TRAITS.includes(trait)) {
                    active.push({
                        name: trait,
                        count,
                        image: traitObj?.image || `/static/images/emblems/${trait}.png`
                    });
                    continue;
                }

                // 🟡 Trait không có trong traits.json
                if (!traitObj) {
                    if (count >= 2) {
                        active.push({
                            name: trait,
                            count,
                            image: `/static/images/emblems/${trait}.png`
                        });
                    }
                    continue;
                }

                // 🟢 Trait thường → phải đạt mốc
                if (Array.isArray(traitObj.thresholds)) {
                    const need = Math.min(...traitObj.thresholds);
                    if (count >= need) {
                        active.push({
                            name: trait,
                            count,
                            image: traitObj.image
                        });
                    }
                }
            }

            return active;
        }




        // ===== DISPLAY RESULTS =====
        function displayResults(results) {
            const container = document.getElementById("resultsContainer");

            if (!results || results.length === 0) {
                container.innerHTML = '<div class="no-results">Không tìm thấy team comp phù hợp</div>';
                return;
            }

            const tableHtml = `
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>Score</th>
                            <th>Cost</th>
                            <th>Size</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${results.map((result, idx) => {
                            const traits = calculateTraits(result.team);
                            return `
                                <tr>
                                    <td>
                                        <div class="team-champions">
                                            ${result.team.map(name => {
                                                const isForced = forcedChampions
                                                    .map(c => c.toLowerCase())
                                                    .includes(name.toLowerCase());
                                                
                                                const imgSrc = getChampionImage(name);
                                                const imgHtml = imgSrc 
                                                    ? `<img src="${imgSrc}" onerror="this.style.display='none'" alt="${name}">`
                                                    : `<span class="img-placeholder">👤</span>`;

                                                return `
                                                    <span class="champ-badge ${isForced ? "forced" : ""}">
                                                        ${imgHtml}
                                                        ${name}
                                                    </span>
                                                `;
                                            }).join("")}

                                            <span
                                                id="trait-arrow-${idx}"
                                                class="trait-toggle"
                                                onclick="toggleTraits(${idx})"
                                            >
                                                ▸
                                            </span>

                                        </div>
                                        <div class="trait-panel" id="trait-${idx}">
                                            ${
                                                traits.length
                                                    ? traits.map(t => {
                                                        const imgHtml = t.image 
                                                            ? `<img src="${t.image}" onerror="this.style.display='none'" alt="${t.name}">`
                                                            : `<span>⚡</span>`;
                                                        return `<span class="trait-badge">${imgHtml}${t.count} ${t.name}</span>`;
                                                    }).join("")
                                                    : "<em>Không kích hệ nào</em>"
                                            }
                                        </div>
                                    </td>
                                    <td><span class="score-badge">${result.score}</span></td>
                                    <td>${result.cost}</td>
                                    <td>${result.team_size}</td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHtml;
        }

        function toggleTraits(idx) {
            const panel = document.getElementById(`trait-${idx}`);
            const arrow = document.getElementById(`trait-arrow-${idx}`);

            const isOpen = window.getComputedStyle(panel).display === "block";

            panel.style.display = isOpen ? "none" : "block";
            arrow.textContent = isOpen ? "▸" : "▾";
        }


        // ===== ERROR HANDLING =====
        function showError(msg) {
            const errorEl = document.getElementById("errorMsg");
            errorEl.textContent = msg;
            errorEl.classList.add("show");
            setTimeout(() => errorEl.classList.remove("show"), 4000);
        }

        // ===== START =====
        init();
    </script>
</body>
</html>
